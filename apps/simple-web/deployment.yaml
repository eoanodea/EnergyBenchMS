---
apiVersion: v1
kind: Namespace
metadata:
  name: simple-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-web
  namespace: simple-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-web
  template:
    metadata:
      labels:
        app: simple-web
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: simple-web
  namespace: simple-web
spec:
  type: NodePort
  selector:
    app: simple-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007

