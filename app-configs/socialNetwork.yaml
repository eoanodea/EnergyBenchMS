manifest_path: social-network.yaml
namespace: socialnetwork

resource_overrides:
  - kind: Service
    name: nginx-thrift
    namespace: socialnetwork
    patch:
      spec:
        type: NodePort
        ports:
          - port: 8080
            targetPort: 8080
            nodePort: 32554

exclude_resource_patterns:
  - "(^|/)loadgenerator($|[-/])"
  - "(^|/)grafana($|[-/])"
  - "(^|/)prometheus($|[-/])"
